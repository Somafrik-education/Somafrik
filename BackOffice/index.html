        <h1>BackOffice autonome retiré</h1>

          L'application statique <code>BackOffice/</code> et la synchronisation globale

          Utilisez l'application Web (<code>/web/</code>) et les APIs métier dédiées par domaine.
        </p>

          <a class="primary" href="/web/">Ouvrir l'application Web</a>
