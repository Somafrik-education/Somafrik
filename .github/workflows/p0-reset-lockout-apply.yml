name: P0 Reset Lockout Apply

on:
  push:
    branches: [agent/p0-password-reset-lockout]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-password-reset-lockout
          fetch-depth: 0
      - name: Apply canonical reset-password fix and E2E
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('backend/server.js')
          text = server.read_text()
          start_marker = 'app.post("/api/users/:id/reset-password", requireAuth, asyncHandler(async (req, res) => {'
          end_marker = 'app.get("/api/payments", requireAuth, requirePermission("GET /api/payments"), asyncHandler(async (req, res) => {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''app.post("/api/users/:id/reset-password", requireAuth, asyncHandler(async (req, res) => {
            if (!canResetUserPassword(req.principal)) {
              throw new BusinessError(403, "Permission insuffisante pour réinitialiser le mot de passe.");
            }

            // Comptes utilisateurs = PostgreSQL canonique. Aucun lookup via backoffice_state.
            const canonicalUsers = await repository.listClientsProjection();
            const scopedUsers = tenantScopeService.filterRows(canonicalUsers, req.principal);
            const requested = String(req.params.id);
            const target = scopedUsers.find((user) =>
              [user.id, user.publicId, user.identityCode, user.userCode, user.identifier].some(
                (value) => String(value ?? "") === requested,
              ),
            );

            if (!target) {
              throw new BusinessError(404, "Utilisateur introuvable dans votre établissement.");
            }

            if (isPendingValidationUser(target) && !isSuperAdminPrincipal(req.principal)) {
              throw new BusinessError(
                409,
                "Compte en attente de validation par le Super Administrateur. Aucune action n'est possible avant validation.",
              );
            }

            const temporaryPassword = String(req.body?.temporaryPassword ?? "").trim();
            const passwordError = validateAccountSecret(temporaryPassword);
            if (passwordError) {
              throw new BusinessError(400, passwordError);
            }

            const lookupAliases = [
              target.id,
              target.publicId,
              target.identityCode,
              target.userCode,
              target.identifier,
            ].filter(Boolean);
            const lockoutAliases = [
              target.publicId,
              target.identityCode,
              target.userCode,
              target.identifier,
              target.email,
              target.phone,
            ]
              .map((value) => String(value ?? "").trim().toLowerCase())
              .filter(Boolean);
            const schoolScopes = [...new Set([
              target.schoolCode,
              req.principal?.schoolCode,
              "*",
            ]
              .map((value) => String(value ?? "").trim().toUpperCase())
              .filter(Boolean))];

            // Reset + révocation sessions + déverrouillage dans la même transaction PostgreSQL.
            const updatedUser = await repository.withTransaction(async (tx) => {
              const txRepo = repository.createTxScope(tx);
              const updated = await txRepo.resetUserPassword(lookupAliases, temporaryPassword);
              if (!updated) {
                throw new BusinessError(404, "Utilisateur introuvable dans votre établissement.");
              }

              await tx.query(
                `UPDATE sessions
                 SET revoked_at = NOW(), revoke_reason = 'password_reset'
                 WHERE user_id = $1 AND revoked_at IS NULL`,
                [target.id],
              );

              if (lockoutAliases.length && schoolScopes.length) {
                await tx.query(
                  `DELETE FROM login_lockouts
                   WHERE identifier_normalized = ANY($1::text[])
                     AND school_scope = ANY($2::text[])`,
                  [lockoutAliases, schoolScopes],
                );
              }
              return updated;
            });

            await auditService.record(req, "reset_user_password", "user", target.id, {
              user: target.identifier ?? target.publicId,
              oldPasswordInvalidated: true,
              sessionsRevoked: true,
              loginLockoutCleared: true,
            });
            res.json({
              temporaryPassword,
              user: {
                ...sanitizeUserForResponse(updatedUser),
                hasTemporaryPassword: true,
              },
            });
          }));

          '''
          server.write_text(text[:start] + replacement + text[end:])

          test = Path('backend/scripts/verify-admin-user-creation.js')
          t = test.read_text()
          t = t.replace('SOMAFRIK_DISABLE_LOGIN_LOCKOUT: "true",', 'SOMAFRIK_DISABLE_LOGIN_LOCKOUT: "false",', 1)
          anchor = '''    const schoolAdminReload = await login(displayedSchoolAdminId, schoolAdminPassword, SCHOOL_CD);
              assert.ok((schoolAdminReload.user.roleKeys || []).includes("SCHOOL_ADMIN"), "relogin Admin School par publicId échoué");'''
          # indentation in source is four spaces, normalize exact anchor if needed
          anchor = anchor.replace('              assert', '    assert')
          if t.count(anchor) != 1:
              raise SystemExit(f'expected schoolAdminReload anchor exactly once, found {t.count(anchor)}')
          extra = anchor + '''

              // P0 reset password : verrouiller volontairement le compte, puis exiger un reset qui
              // déverrouille immédiatement, révoque les sessions et impose le changement du secret.
              for (let attempt = 0; attempt < 5; attempt += 1) {
                const failed = await request("/backoffice/login", {
                  method: "POST",
                  body: { identifier: displayedSchoolAdminId, password: "WrongPassword!2026", schoolCode: SCHOOL_CD },
                });
                assert.equal(failed.status, 401, `échec login ${attempt + 1}: ${JSON.stringify(failed.data)}`);
              }
              const locked = await request("/backoffice/login", {
                method: "POST",
                body: { identifier: displayedSchoolAdminId, password: schoolAdminPassword, schoolCode: SCHOOL_CD },
              });
              assert.equal(locked.status, 423, `compte non verrouillé après 5 échecs: ${JSON.stringify(locked.data)}`);

              const resetTemporaryPassword = "ResetSchool!2026";
              const reset = await request(`/users/${encodeURIComponent(activeSchoolIdentity.id)}/reset-password`, {
                method: "POST",
                token: superadmin.token,
                body: { temporaryPassword: resetTemporaryPassword },
              });
              assert.equal(reset.status, 200, `reset password: ${JSON.stringify(reset.data)}`);
              assert.equal(reset.data.temporaryPassword, resetTemporaryPassword);
              assert.equal(reset.data.user?.mustChangePassword, true, "mustChangePassword absent après reset");

              const immediate = await request("/backoffice/login", {
                method: "POST",
                body: { identifier: displayedSchoolAdminId, password: resetTemporaryPassword, schoolCode: SCHOOL_CD },
              });
              assert.equal(immediate.status, 200, `login immédiat après reset: ${JSON.stringify(immediate.data)}`);
              assert.equal(immediate.data.user?.mustChangePassword, true, "login reset doit imposer changement mot de passe");

              const resetToken = immediate.data.accessToken || immediate.data.token;
              const finalPassword = "SchoolAdminFinal!2026";
              const changedAfterReset = await request("/auth/change-password", {
                method: "POST",
                token: resetToken,
                body: { newPassword: finalPassword },
              });
              assert.equal(changedAfterReset.status, 200, `change-password après reset: ${JSON.stringify(changedAfterReset.data)}`);
              const finalLogin = await login(displayedSchoolAdminId, finalPassword, SCHOOL_CD);
              assert.ok((finalLogin.user.roleKeys || []).includes("SCHOOL_ADMIN"), "relogin final après reset échoué");'''
          extra = extra.replace('\n              //', '\n    //').replace('\n              for', '\n    for').replace('\n                const', '\n      const').replace('\n                  method', '\n        method').replace('\n                  body', '\n        body').replace('\n                });', '\n      });').replace('\n                assert', '\n      assert').replace('\n              }', '\n    }').replace('\n              const', '\n    const').replace('\n                method', '\n      method').replace('\n                token', '\n      token').replace('\n                body', '\n      body').replace('\n              });', '\n    });').replace('\n              assert', '\n    assert')
          test.write_text(t.replace(anchor, extra, 1))
          PY
          git diff --check
          git diff -- backend/server.js backend/scripts/verify-admin-user-creation.js
      - name: Commit and push
        run: |
          git config user.name "somafrik-cto-bot"
          git config user.email "cto-bot@somafrik.local"
          git add backend/server.js backend/scripts/verify-admin-user-creation.js
          git commit -m "fix(auth): reset password déverrouille et révoque les sessions"
          git push origin HEAD:agent/p0-password-reset-lockout
