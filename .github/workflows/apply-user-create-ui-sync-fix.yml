name: Apply User Create UI Sync Fix

on:
  push:
    branches: [agent/p0-user-create-ui-sync]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-user-create-ui-sync
          fetch-depth: 0

      - name: Patch UsersPage create scope and API errors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('web/src/pages/UsersPage.tsx')
          source = path.read_text()
          old_create = '''          const created = (await clientsApi.createUser({
            firstName: syncedUser.firstName,
            lastName: syncedUser.lastName,
            email: syncedUser.email,
            phone: syncedUser.phone,
            gender: syncedUser.gender,
            status: syncedUser.status,
            temporaryPassword: syncedUser.temporaryPassword,
          })) as UserAccount;'''
          new_create = '''          const targetSchoolCode = String(syncedUser.schoolCode || schoolCode || "").trim();
          const created = (await clientsApi.createUser({
            firstName: syncedUser.firstName,
            lastName: syncedUser.lastName,
            email: syncedUser.email,
            phone: syncedUser.phone,
            gender: syncedUser.gender,
            status: syncedUser.status,
            temporaryPassword: syncedUser.temporaryPassword,
            ...(targetSchoolCode && targetSchoolCode !== "*" ? { schoolCode: targetSchoolCode } : {}),
          })) as UserAccount;'''
          if source.count(old_create) != 1:
              raise SystemExit(f'createUser block count={source.count(old_create)}')
          source = source.replace(old_create, new_create, 1)
          old_catch = '''    } catch {
      showToast("Échec de la synchronisation", "error");
      throw new Error("sync failed");
    } finally {
      setBusy(false);
    }
  }

  async function toggleSuspend'''
          new_catch = '''    } catch (error) {
      const message = error instanceof Error ? error.message : "Échec de la synchronisation";
      showToast(message, "error");
      throw error instanceof Error ? error : new Error(message);
    } finally {
      setBusy(false);
    }
  }

  async function toggleSuspend'''
          if source.count(old_catch) != 1:
              raise SystemExit(f'persistUsers catch count={source.count(old_catch)}')
          source = source.replace(old_catch, new_catch, 1)
          path.write_text(source)
          PY
          npm ci
          npm run lint -- --max-warnings=9999

      - name: Commit product fix
        run: |
          git config user.name "Somafrik CTO Bot"
          git config user.email "cto-bot@somafrik.local"
          git add web/src/pages/UsersPage.tsx
          git commit -m "fix(web): transmettre le scope établissement à la création utilisateur"
          git push origin HEAD:agent/p0-user-create-ui-sync
