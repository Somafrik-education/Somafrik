name: SETTINGS-01 Functional Audit

on:
  pull_request:
    branches: [develop]
    paths:
      - "docs/audits/settings-functional-audit.md"
      - "docs/audits/settings-functional-matrix.json"
      - "scripts/verify-settings-functional-audit.js"
      - "web/src/pages/parametres/**"
      - "web/src/pages/finances/FinanceCatalogConfig.tsx"
      - "web/src/App.tsx"
      - "package.json"
      - ".github/workflows/settings-functional-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

# CI-FAST-01 : une nouvelle poussée sur la PR annule l'exécution précédente
# (les autres déclencheurs ne sont jamais annulés).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  settings-functional-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Verify SETTINGS-01 functional audit
        run: npm run verify:settings-functional-audit
