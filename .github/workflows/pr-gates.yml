name: PR Gates

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.12.0"
  DATABASE_URL: postgresql://somafrik:somafrik123@localhost:5432/somafrik
  GITLEAKS_VERSION: "8.24.3"

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      workflows: ${{ steps.detect.outputs.workflows }}
      db: ${{ steps.detect.outputs.db }}
      auth: ${{ steps.detect.outputs.auth }}
      sync: ${{ steps.detect.outputs.sync }}
      classes: ${{ steps.detect.outputs.classes }}
      students: ${{ steps.detect.outputs.students }}
      teachers: ${{ steps.detect.outputs.teachers }}
      finance: ${{ steps.detect.outputs.finance }}
      pedagogy: ${{ steps.detect.outputs.pedagogy }}
      reportcard: ${{ steps.detect.outputs.reportcard }}
      planning: ${{ steps.detect.outputs.planning }}
      users: ${{ steps.detect.outputs.users }}
      platform: ${{ steps.detect.outputs.platform }}
      lot4_sensitive: ${{ steps.detect.outputs.lot4_sensitive }}
      web: ${{ steps.detect.outputs.web }}
      mobile: ${{ steps.detect.outputs.mobile }}
      dependencies: ${{ steps.detect.outputs.dependencies }}
      targeted: ${{ steps.detect.outputs.targeted }}
      backend: ${{ steps.pg_select.outputs.backend }}
      pg_mode: ${{ steps.pg_select.outputs.pg_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Classify changed paths
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"

          code=false
          workflows=false
          db=false
          auth=false
          sync=false
          classes=false
          students=false
          teachers=false
          finance=false
          pedagogy=false
          reportcard=false
          planning=false
          users=false
          platform=false
          lot4_sensitive=false
          web=false
          mobile=false
          dependencies=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            lower="${file,,}"

            case "$lower" in
              backend/*|web/*|mobile/*|scripts/*|packages/*|apps/*|package.json|package-lock.json)
                code=true
                ;;
            esac
            case "$lower" in
              .github/workflows/*) workflows=true ;;
            esac
            case "$lower" in
              package.json|package-lock.json|backend/package*.json|web/package*.json|mobile/package*.json)
                dependencies=true
                ;;
            esac
            case "$lower" in
              backend/db/*|backend/migrations/*|backend/*migration*|backend/*schema*)
                db=true
                ;;
            esac
            case "$lower" in
              web/*) web=true ;;
              mobile/*) mobile=true ;;
            esac

            if [[ "$lower" =~ (auth|jwt|session|permission|rbac|role|login|identity|principal) ]]; then auth=true; fi
            if [[ "$lower" =~ (sync|canonical-state|outbox|legacy.*state|backoffice-state) ]]; then sync=true; fi
            if [[ "$lower" =~ (class|academic-year|academicyear) ]]; then classes=true; fi
            if [[ "$lower" =~ (student|enrollment|parent-link|presence|attendance) ]]; then students=true; fi
            if [[ "$lower" =~ (teacher|subject|assignment) ]]; then teachers=true; fi
            if [[ "$lower" =~ (finance|payment|fee|cash|receipt) ]]; then finance=true; fi
            if [[ "$lower" =~ (pedagog|evaluation|grade|note|presence|attendance|reference) ]]; then pedagogy=true; fi
            if [[ "$lower" =~ (reportcard|report-card|report_card) ]]; then reportcard=true; fi
            if [[ "$lower" =~ (planning|schedule|room|replacement|course) ]]; then planning=true; fi
            if [[ "$lower" =~ (user|client|parent|role|permission|identity) ]]; then users=true; fi
            if [[ "$lower" =~ (platform|school|country|notification|subscription|setting|document|exam|lockout|export) ]]; then platform=true; fi
            if [ "$lower" = "mobile/src/navigation/roledrawerpreferences.ts" ]; then lot4_sensitive=true; fi
          done <<< "$changed"

          targeted=false
          for flag in db auth sync classes students teachers finance pedagogy reportcard planning users platform web mobile dependencies; do
            if [ "${!flag}" = "true" ]; then targeted=true; fi
          done

          for flag in code workflows db auth sync classes students teachers finance pedagogy reportcard planning users platform lot4_sensitive web mobile dependencies targeted; do
            printf '%s=%s\n' "$flag" "${!flag}" >> "$GITHUB_OUTPUT"
          done

      # CI-FAST-01 — niveau A : quelle part de la baseline backend MONO-T0 la PR
      # exige (none | targeted | full). En cas de doute : full. Voir
      # docs/project/CI-FAST-01.md et scripts/ci-pg-select.js.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: pg_select
        name: Select backend baseline (CI-FAST-01)
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            | node scripts/ci-pg-select.js --out=ci-pg-selection.json
          {
            echo "## Sélection baseline backend (CI-FAST-01)"
            echo
            echo '```json'
            cat ci-pg-selection.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend selection
        uses: actions/upload-artifact@v4
        with:
          name: ci-pg-selection
          path: ci-pg-selection.json
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Quality
    needs: scope
    if: needs.scope.outputs.code == 'true' || needs.scope.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Branding master
        run: npm run verify:branding-master
      - name: Install dependencies
        run: npm run ci:install
      - name: Parent E2E contract
        run: npm run verify:parent-e2e-contract
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Build Web
        env:
          VITE_API_URL: https://api.somafrik.app
        run: npm run build

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan repository
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  core:
    name: Core tests
    needs: scope
    if: needs.scope.outputs.code == 'true' || needs.scope.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: somafrik
          POSTGRES_USER: somafrik
          POSTGRES_PASSWORD: somafrik123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U somafrik -d somafrik"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: Foundation
        run: npm run verify:v2-foundation
      - name: Security baseline
        run: |
          set -euo pipefail
          npm run verify:jwt-header
          npm run verify:auth-sessions
          npm run verify:sec-tenant-01
          npm run verify:sec-auth-03
          npm run verify:sec-pdf-01
          npm run verify:privacy-erasure
          npm run verify:sec-auth-04
          npm run verify:sec-auth-05
          npm run verify:sec-tenant-02
          npm run verify:sec-jwt-01
          npm run verify:governance-r15
          npm run verify:rbac-s1-4
          npm run verify:sanitize-user-responses
          npm run verify:db-config
          npm run verify:supabase-data-api-lockdown
          npm run verify:function-search-path
          npm run verify:platform-personal-data-deny
          npm run verify:preprod-503-local

  targeted:
    name: Risk-targeted
    needs: scope
    if: needs.scope.outputs.targeted == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: somafrik
          POSTGRES_USER: somafrik
          POSTGRES_PASSWORD: somafrik123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U somafrik -d somafrik"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install

      - name: Dependency audit
        if: needs.scope.outputs.dependencies == 'true'
        run: npm run audit:ci

      - name: PostgreSQL and bootstrap
        if: needs.scope.outputs.db == 'true'
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
          SOMAFRIK_DB_REQUIRED: "true"
          SOMAFRIK_SKIP_DEMO_SEED: "true"
          SOMAFRIK_BOOTSTRAP_REQUIRED: "true"
          SOMAFRIK_BOOTSTRAP_PORT: "5056"
        run: |
          set -euo pipefail
          npm run verify:db-config
          npm run verify:runtime-bootstrap
          npm run verify:supabase-data-api-lockdown

      - name: ADMIN-01 PostgreSQL PG-01–08
        if: needs.scope.outputs.auth == 'true'
        run: |
          set -euo pipefail
          node backend/lib/functionalRbacAdmin01.pg.test.js

      - name: Auth and RBAC
        if: needs.scope.outputs.auth == 'true'
        run: |
          set -euo pipefail
          npm run verify:functional-rbac
          npm run verify:user-role-lifecycle
          npm run verify:users-login-identity
          npm run verify:platform-personal-data-deny

      - name: Classes
        if: needs.scope.outputs.classes == 'true'
        run: |
          set -euo pipefail
          npm run verify:classes-management
          npm run verify:academic-year-tenant

      - name: Students and attendance
        if: needs.scope.outputs.students == 'true'
        run: |
          set -euo pipefail
          npm run verify:class-student-enrollment
          npm run verify:students-fiche-consolidation
          npm run verify:presences-roster
          npm run verify:mobile-sync-l1-students
          npm run verify:student-access-cards

      - name: Teachers
        if: needs.scope.outputs.teachers == 'true'
        run: |
          set -euo pipefail
          npm run verify:teacher-account-creation
          npm run verify:teachers-lifecycle
          npm run verify:teacher-login-scope
          npm run verify:mobile-sync-l1-assignments

      - name: Finance
        if: needs.scope.outputs.finance == 'true'
        run: |
          set -euo pipefail
          npm run verify:finance-domain-invariants
          npm run verify:finance-fee-type-canonical
          npm run verify:finance-obligation-lifecycle
          npm run verify:finance-management
          npm run verify:finance-multi-item-payment
          npm run verify:finance-web-mobile-convergence
          npm run verify:finance-rbac

      - name: Pedagogy
        if: needs.scope.outputs.pedagogy == 'true'
        run: |
          set -euo pipefail
          npm run verify:pedagogy-management
          npm run verify:education-reference-data
          npm run verify:evaluation-types-data
          npm run verify:mobile-sync-l1-school-courses

      - name: Report card LOT 0 contracts
        if: needs.scope.outputs.reportcard == 'true'
        run: npm run verify:report-card-lot0

      - name: Report card LOT 1 profiles
        if: needs.scope.outputs.reportcard == 'true'
        run: npm run verify:report-card-lot1

      - name: Report card LOT 2 schema
        if: needs.scope.outputs.reportcard == 'true'
        run: npm run verify:report-card-lot2

      - name: Report card LOT 3 engine
        if: needs.scope.outputs.reportcard == 'true'
        run: npm run verify:report-card-lot3

      - name: Report card LOT 4 snapshot publication
        if: needs.scope.outputs.reportcard == 'true'
        run: npm run verify:report-card-lot4

      - name: Report card LOT 5 PDF and printable QR
        if: needs.scope.outputs.reportcard == 'true'
        run: npm run verify:report-card-lot5

      - name: Report card LOT 6 configuration workflow
        if: needs.scope.outputs.reportcard == 'true'
        run: npm run verify:report-card-lot6

      - name: Report card LOT 7 web and public verify
        if: needs.scope.outputs.reportcard == 'true'
        run: npm run verify:report-card-lot7

      - name: Report card LOT 8 mobile bulletins
        if: needs.scope.outputs.reportcard == 'true' || needs.scope.outputs.mobile == 'true'
        run: npm run verify:report-card-lot8

      - name: Report card LOT 9 history corrections versions
        if: needs.scope.outputs.reportcard == 'true' || needs.scope.outputs.mobile == 'true' || needs.scope.outputs.web == 'true'
        run: npm run verify:report-card-lot9

      - name: Report card LOT 10 Burundi A/B qualification
        if: needs.scope.outputs.reportcard == 'true' || needs.scope.outputs.mobile == 'true' || needs.scope.outputs.web == 'true'
        run: npm run verify:report-card-lot10

      - name: Report card LOT 11 source artifact mapping
        if: needs.scope.outputs.reportcard == 'true' || needs.scope.outputs.web == 'true'
        run: npm run verify:report-card-lot11

      - name: Report card S1 E2E Playwright
        if: needs.scope.outputs.reportcard == 'true' || needs.scope.outputs.web == 'true'
        run: npm run verify:report-card-s1-e2e

      - name: Planning
        if: needs.scope.outputs.planning == 'true'
        run: |
          set -euo pipefail
          npm run verify:planning-v2-weekly
          npm run verify:planning-v2-web
          npm run verify:planning-rooms
          npm run verify:planning-replacements
          npm run verify:planning-course-options
          npm run verify:mobile-sync-l1-course-schedules
          npm run verify:school-course-ambiguity-inventory

      - name: Users
        if: needs.scope.outputs.users == 'true'
        run: |
          set -euo pipefail
          npm run verify:clients-management
          npm run verify:user-role-lifecycle
          npm run verify:parent-linking
          npm run verify:users-tenant

      - name: Platform and school settings
        if: needs.scope.outputs.platform == 'true'
        run: |
          set -euo pipefail
          npm run verify:platform-management
          npm run verify:school-settings-data
          npm run verify:student-access-cards
          npm run verify:login-lockout-data

      - name: School setup status LOT 0
        if: needs.scope.outputs.platform == 'true'
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
          SOMAFRIK_DB_REQUIRED: "true"
          SOMAFRIK_SKIP_DEMO_SEED: "true"
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          npm run verify:school-setup-status-lot0-red

      - name: School setup resilience LOT 3
        if: needs.scope.outputs.platform == 'true'
        run: npm run verify:school-setup-lot3-red

      - name: School setup optional completeness LOT 4
        if: needs.scope.outputs.platform == 'true' || needs.scope.outputs.lot4_sensitive == 'true'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          if ! git merge-base "origin/${{ github.base_ref }}" HEAD >/dev/null 2>&1; then
            git fetch --no-tags --deepen=100 origin || true
            git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          fi
          npm run verify:school-setup-lot4-red

      - name: Web tests
        if: needs.scope.outputs.web == 'true'
        run: |
          set -euo pipefail
          npm --prefix web test
          npm run verify:student-card-web

      - name: Mobile safety
        if: needs.scope.outputs.mobile == 'true'
        run: |
          set -euo pipefail
          npm run verify:mobile-security
          npm run verify:student-card-qr
          npm run verify:mobile-data-truth
          npm run verify:mobile-live-permissions-refresh
          npm run verify:mobile-cta-rbac-alignment
          npm run verify:mobile-network-resilience
          npm run verify:mobile-l1-sqlite-cache
          npm run verify:mobile-l1-offline-reads
          npm run verify:mobile-rc2-offline-read-smoke
          npm --prefix Mobile run test:mobile-parent-profile-audit
          npx --yes tsx Mobile/src/lib/roleSelectionLayout.test.ts
          npx --yes tsx Mobile/src/lib/progressiveDisclosureUx.test.ts
          node Mobile/scripts/verify-progressive-disclosure-red.js

      - name: Canonical sync
        if: needs.scope.outputs.sync == 'true'
        run: |
          set -euo pipefail
          npm run verify:canonical-state-convergence
          npm run verify:sync-end-to-end
          node scripts/verify-remove-legacy-sync-core.js

  lot0:
    name: LOT 0 parity
    needs: scope
    if: needs.scope.outputs.mobile == 'true' || needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: LOT 0 tests and Mobile verifies
        run: |
          set -euo pipefail
          npm run test:lot0-parity
          npm run verify:mobile-attendance-hydration
          npm run verify:mobile-home-data-truth

  lot1:
    name: LOT 1 parity
    needs: scope
    if: needs.scope.outputs.mobile == 'true' || needs.scope.outputs.web == 'true' || needs.scope.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: LOT 1 tests
        run: |
          set -euo pipefail
          npm run test:lot1-parity

  lot2:
    name: LOT 2 parity
    needs: scope
    if: needs.scope.outputs.mobile == 'true' || needs.scope.outputs.web == 'true' || needs.scope.outputs.students == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: somafrik
          POSTGRES_USER: somafrik
          POSTGRES_PASSWORD: somafrik123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U somafrik -d somafrik"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: LOT 2 tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://somafrik:somafrik123@localhost:5432/somafrik
          JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
          SOMAFRIK_DB_REQUIRED: "true"
          SOMAFRIK_SKIP_DEMO_SEED: "true"
        run: |
          set -euo pipefail
          npm run test:lot2-parity

  lot3:
    name: LOT 3 parity
    needs: scope
    if: needs.scope.outputs.mobile == 'true' || needs.scope.outputs.web == 'true' || needs.scope.outputs.teachers == 'true' || needs.scope.outputs.users == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: somafrik
          POSTGRES_USER: somafrik
          POSTGRES_PASSWORD: somafrik123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U somafrik -d somafrik"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: LOT 3 tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://somafrik:somafrik123@localhost:5432/somafrik
          JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
          SOMAFRIK_DB_REQUIRED: "true"
          SOMAFRIK_SKIP_DEMO_SEED: "true"
        run: |
          set -euo pipefail
          npm run test:lot3-parity

  lot4:
    name: LOT 4 parity
    needs: scope
    if: needs.scope.outputs.mobile == 'true' || needs.scope.outputs.web == 'true' || needs.scope.outputs.finance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: LOT 4 tests
        run: |
          set -euo pipefail
          npm run test:lot4-parity

  lot5:
    name: LOT 5 parity
    needs: scope
    if: needs.scope.outputs.mobile == 'true' || needs.scope.outputs.web == 'true' || needs.scope.outputs.pedagogy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: LOT 5 tests
        run: |
          set -euo pipefail
          npm run test:lot5-parity

  lot6:
    name: LOT 6 parity
    needs: scope
    if: needs.scope.outputs.mobile == 'true' || needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: LOT 6 tests
        run: |
          set -euo pipefail
          npm run test:lot6-parity

  lot7:
    name: LOT 7 parity
    needs: scope
    if: needs.scope.outputs.mobile == 'true' || needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: LOT 7 tests
        run: |
          set -euo pipefail
          npm run test:lot7-parity

  lot8:
    name: LOT 8 parity
    needs: scope
    if: needs.scope.outputs.mobile == 'true' || needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: LOT 8 tests
        run: |
          set -euo pipefail
          npm run test:lot8-parity

  # CI-FAST-01 — niveau A, backend : tests unitaires complets, garde de
  # l'exécuteur, inventaire MONO-T1 et outils CI. Dès qu'un fichier backend
  # (ou ce qui l'exécute) change.
  backend_unit:
    name: Backend unit (fast)
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      # Même environnement que le job unit de la baseline MONO-T0 : sans base.
      # Le DATABASE_URL global de PR Gates ferait viser aux tests unitaires
      # un PostgreSQL absent de ce job.
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          for attempt in 1 2 3; do
            if npm ci --prefix backend; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "npm ci backend failed after 3 attempts"; exit 1; fi
            echo "Retrying backend install (Puppeteer Chrome archive)"
            rm -rf "$HOME/.cache/puppeteer/chrome"
          done
      - name: Baseline guard tests and CI-FAST-01 tools (no database)
        run: node --test scripts/backend-test-baseline.test.js scripts/ci-fast-01.test.js
      - name: MONO-T1 route inventory is up to date (no database)
        run: node scripts/mono-t1-route-inventory.js --check
      - name: Run backend unit baseline
        run: node scripts/backend-test-baseline.js unit
      - name: Upload unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-backend-unit
          path: |
            backend-test-baseline/unit/*.json
            backend-test-baseline/unit/*.md
          if-no-files-found: warn
          retention-days: 14

  # CI-FAST-01 — niveau A, PostgreSQL : sélection (complète ou ciblée + socle
  # sécurité) découpée en lots, chacun sur SON cluster PostgreSQL éphémère
  # (isolation entre lots : aucun cluster partagé).
  backend_pg:
    name: Backend PostgreSQL (shard ${{ matrix.shard }}/3)
    needs: scope
    if: needs.scope.outputs.pg_mode == 'full' || needs.scope.outputs.pg_mode == 'targeted'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: somafrik_disposable_test_cluster
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      SOMAFRIK_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/somafrik_disposable_test_cluster
      JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          for attempt in 1 2 3; do
            if npm ci --prefix backend; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "npm ci backend failed after 3 attempts"; exit 1; fi
            echo "Retrying backend install (Puppeteer Chrome archive)"
            rm -rf "$HOME/.cache/puppeteer/chrome"
          done
      - name: Install poppler-utils (pdftotext)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
      - name: Declare the job cluster disposable (sentinel comment)
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d somafrik_disposable_test_cluster -v ON_ERROR_STOP=1 \
            -c "COMMENT ON DATABASE somafrik_disposable_test_cluster IS 'somafrik:disposable-test-cluster'"
      - uses: actions/download-artifact@v4
        with:
          name: ci-pg-selection
      - name: Run backend PostgreSQL shard
        run: node scripts/backend-test-baseline.js pg --select=ci-pg-selection.json --shard=${{ matrix.shard }}/3
      - name: Upload shard plan and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-backend-pg-shard-${{ matrix.shard }}
          path: |
            backend-test-baseline/pg/*.json
            backend-test-baseline/pg/*.md
          if-no-files-found: warn
          retention-days: 14

  # CI-FAST-01 — contrôle d'agrégation : chaque fichier sélectionné a été
  # attribué à exactement un lot (aucun vert sur des tests non déclenchés).
  backend_pg_verify:
    name: Backend PostgreSQL shards complete
    needs: [scope, backend_pg]
    if: always() && (needs.scope.outputs.pg_mode == 'full' || needs.scope.outputs.pg_mode == 'targeted')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: ci-pg-selection
      - uses: actions/download-artifact@v4
        with:
          pattern: pr-backend-pg-shard-*
          path: shard-plans
      - name: Verify shard coverage
        run: node scripts/ci-baseline-shards-verify.js --selection=ci-pg-selection.json --plans=shard-plans --shards=3

  required:
    name: Required
    if: always()
    needs: [scope, quality, secrets, core, targeted, lot0, lot1, lot2, lot3, lot4, lot5, lot6, lot7, lot8, backend_unit, backend_pg, backend_pg_verify]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required PR gates
        env:
          CODE: ${{ needs.scope.outputs.code }}
          WORKFLOWS: ${{ needs.scope.outputs.workflows }}
          TARGETED_SCOPE: ${{ needs.scope.outputs.targeted }}
          BACKEND: ${{ needs.scope.outputs.backend }}
          PG_MODE: ${{ needs.scope.outputs.pg_mode }}
          BACKEND_UNIT: ${{ needs.backend_unit.result }}
          BACKEND_PG: ${{ needs.backend_pg.result }}
          BACKEND_PG_VERIFY: ${{ needs.backend_pg_verify.result }}
          SCOPE: ${{ needs.scope.result }}
          QUALITY: ${{ needs.quality.result }}
          SECRETS: ${{ needs.secrets.result }}
          CORE: ${{ needs.core.result }}
          TARGETED: ${{ needs.targeted.result }}
          LOT0: ${{ needs.lot0.result }}
          LOT1: ${{ needs.lot1.result }}
          LOT2: ${{ needs.lot2.result }}
          LOT3: ${{ needs.lot3.result }}
          LOT4: ${{ needs.lot4.result }}
          LOT5: ${{ needs.lot5.result }}
          LOT6: ${{ needs.lot6.result }}
          LOT7: ${{ needs.lot7.result }}
          LOT8: ${{ needs.lot8.result }}
        run: |
          set -euo pipefail
          failed=0
          # CI-FAST-01 : un job PLANIFIÉ par Scope doit réussir ; « skipped »
          # n'est accepté que pour un job que Scope n'a pas planifié.
          expect_success() {
            local name="$1" planned="$2" result="$3"
            if [ "$planned" = "true" ]; then
              if [ "$result" != "success" ]; then echo "::error::$name planifié mais $result" >&2; failed=1; fi
            else
              case "$result" in
                success|skipped) ;;
                *) echo "::error::$name : $result" >&2; failed=1 ;;
              esac
            fi
            echo "$name planned=$planned result=$result"
          }
          [ "$SCOPE" = "success" ] || { echo "::error::Scope : $SCOPE" >&2; exit 1; }
          case "$PG_MODE" in none|targeted|full) ;; *) echo "::error::pg_mode inattendu « $PG_MODE »" >&2; exit 1 ;; esac
          case "$BACKEND" in true|false) ;; *) echo "::error::backend inattendu « $BACKEND »" >&2; exit 1 ;; esac
          if [ "$CODE" = "true" ] || [ "$WORKFLOWS" = "true" ]; then code_or_workflows=true; else code_or_workflows=false; fi
          if [ "$PG_MODE" != "none" ]; then pg_planned=true; else pg_planned=false; fi
          expect_success Secrets true "$SECRETS"
          expect_success Quality "$code_or_workflows" "$QUALITY"
          expect_success "Core tests" "$code_or_workflows" "$CORE"
          expect_success Risk-targeted "$TARGETED_SCOPE" "$TARGETED"
          expect_success "Backend unit" "$BACKEND" "$BACKEND_UNIT"
          expect_success "Backend PostgreSQL" "$pg_planned" "$BACKEND_PG"
          expect_success "Backend PostgreSQL shards complete" "$pg_planned" "$BACKEND_PG_VERIFY"
          # Lots de parité : condition purement dérivée de Scope (réussi ci-dessus).
          for result in "$LOT0" "$LOT1" "$LOT2" "$LOT3" "$LOT4" "$LOT5" "$LOT6" "$LOT7" "$LOT8"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::LOT parity : $result" >&2; failed=1 ;;
            esac
          done
          exit "$failed"
