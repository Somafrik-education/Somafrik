name: Apply Build Principal Country Fix

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/apply-build-principal-country-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/verify-admin-user-creation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verify-admin-user-creation
          fetch-depth: 0

      - name: Derive first non-empty country code
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/server.js')
          source = path.read_text()
          old = '  const countryCode = user.countryCode ?? countryCodeFromScope(user.countryScope) ?? school.countryCode ?? countryCodeFromSchoolOrCountry(schoolCode, school.country);'
          new = '  const countryCode = user.countryCode || countryCodeFromScope(user.countryScope) || school.countryCode || countryCodeFromSchoolOrCountry(schoolCode, school.country);'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one buildPrincipal countryCode expression, found {count}')
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          node --check backend/server.js

      - name: Commit product fix
        run: |
          if git diff --quiet -- backend/server.js; then
            echo "No product diff generated" >&2
            exit 1
          fi
          git config user.name "Somafrik CTO Bot"
          git config user.email "cto-bot@somafrik.local"
          git add backend/server.js
          git commit -m "fix(auth): dériver un countryCode non vide dans le JWT"
          git push origin HEAD:agent/verify-admin-user-creation
