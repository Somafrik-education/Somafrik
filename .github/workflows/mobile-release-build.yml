name: Mobile Android Release Build

# Preuve AAB du candidat exact. candidate_sha est obligatoire et doit être
# le SHA du ref workflow_dispatch. Aucun overlay de fichiers dans le candidat.
# Aucun eas submit. Aucun upload Play. Aucun secret imprimé.
# Un certificat debug (androiddebugkey) ne peut pas être store-ready : A2 reste HOLD.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character git SHA to build. Must equal the dispatched ref SHA.
        required: true
        type: string
      profile:
        description: Local verification profile
        required: true
        default: preproduction
        type: choice
        options:
          - preproduction
          - production

permissions:
  contents: read

env:
  NODE_VERSION: "22.12.0"

jobs:
  android-aab:
    name: Android AAB evidence
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Require exact candidate SHA
        env:
          CANDIDATE_SHA_INPUT: ${{ inputs.candidate_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -eu
          if ! printf '%s' "$CANDIDATE_SHA_INPUT" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "candidate_sha must be a full 40-character hex SHA"
            exit 1
          fi
          candidate="$(printf '%s' "$CANDIDATE_SHA_INPUT" | tr '[:upper:]' '[:lower:]')"
          dispatch="$(printf '%s' "$DISPATCH_SHA" | tr '[:upper:]' '[:lower:]')"
          if [ "$candidate" != "$dispatch" ]; then
            echo "candidate_sha must equal workflow dispatch SHA"
            exit 1
          fi
          printf 'CANDIDATE_SHA=%s\n' "$candidate" >> "$GITHUB_ENV"

      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 1

      - name: Confirm exact candidate checkout and clean tracked tree
        working-directory: candidate
        run: |
          set -eu
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$CANDIDATE_SHA" ]; then
            echo "Checkout SHA mismatch"
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Candidate checkout is not clean"
            git status --short --untracked-files=no
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            candidate/package-lock.json
            candidate/Mobile/package-lock.json

      - name: Install workspace + Mobile
        working-directory: candidate
        run: npm ci && npm ci --prefix Mobile

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify native AAB and write evidence
        working-directory: candidate
        env:
          SOMAFRIK_REQUIRE_AAB: "1"
          SOMAFRIK_AAB_PROFILES: ${{ inputs.profile }}
          SOMAFRIK_AAB_EVIDENCE: "1"
          SOMAFRIK_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          SOMAFRIK_TOOLING_SHA: ${{ env.CANDIDATE_SHA }}
        run: npm run verify:mobile-native-aab

      - name: Refuse store-ready without verified Play signature
        working-directory: candidate
        run: node Mobile/scripts/aabEvidence.js Mobile/dist/aab-evidence

      - name: Upload AAB evidence
        uses: actions/upload-artifact@v4
        with:
          name: aab-evidence-${{ inputs.profile }}-${{ env.CANDIDATE_SHA }}
          path: |
            candidate/Mobile/dist/aab-evidence/*.aab
            candidate/Mobile/dist/aab-evidence/*-evidence.json
          if-no-files-found: error
          retention-days: 14
