name: Apply Admin Country Password Scope Fix

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/apply-admin-country-password-scope-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/verify-admin-user-creation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/verify-admin-user-creation
          fetch-depth: 0

      - name: Preserve tenant scope after password change
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/server.js')
          source = path.read_text()
          pattern = re.compile(
              r'(?m)^(?P<i>\s*)let safeUser = \{\n'
              r'(?P=i)  \.\.\.sanitizeUserForResponse\(updatedUser\),\n'
              r'(?P=i)  mustChangePassword: false,\n'
              r'(?P=i)\};'
          )
          matches = list(pattern.finditer(source))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one change-password safeUser block, found {len(matches)}')
          indent = matches[0].group('i')
          replacement = (
              f'{indent}const sanitizedUpdatedUser = sanitizeUserForResponse(updatedUser);\n'
              f'{indent}let safeUser = {{\n'
              f'{indent}  ...sanitizedUpdatedUser,\n'
              f'{indent}  schoolCode: sanitizedUpdatedUser?.schoolCode || req.principal.schoolCode || "",\n'
              f'{indent}  countryCode: sanitizedUpdatedUser?.countryCode || req.principal.countryCode || "",\n'
              f'{indent}  countryScope: sanitizedUpdatedUser?.countryScope || req.principal.countryScope || "",\n'
              f'{indent}  mustChangePassword: false,\n'
              f'{indent}}};'
          )
          source = pattern.sub(replacement, source, count=1)
          if 'countryCode: sanitizedUpdatedUser?.countryCode || req.principal.countryCode || ""' not in source:
              raise SystemExit('country scope preservation missing after patch')
          path.write_text(source)
          PY
          node --check backend/server.js

      - name: Commit product fix
        run: |
          if git diff --quiet -- backend/server.js; then
            echo "No product diff generated" >&2
            exit 1
          fi
          git config user.name "Somafrik CTO Bot"
          git config user.email "cto-bot@somafrik.local"
          git add backend/server.js
          git commit -m "fix(auth): préserver le scope pays après changement mot de passe"
          git push origin HEAD:agent/verify-admin-user-creation
