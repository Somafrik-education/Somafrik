name: HELP-V1C Mobile

on:
  pull_request:
    branches: [develop]
    paths:
      - "Mobile/src/help/**"
      - "Mobile/src/navigation/AppNavigator.tsx"
      - "Mobile/metro.config.js"
      - "Mobile/tsconfig.json"
      - "Mobile/package.json"
      - "Mobile/package-lock.json"
      - "packages/help-catalog/**"
      - "scripts/verify-help-v1c-mobile.js"
      - "scripts/verify-help-v1a-catalogue.js"
      - "package.json"
      - ".github/workflows/help-v1c-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  help-v1c-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Mobile/package-lock.json
      - name: Install Mobile dependencies
        run: npm ci --prefix Mobile
      - name: Verify HELP-V1C Mobile
        run: npm run verify:help-v1c-mobile
