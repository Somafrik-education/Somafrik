name: UI French Autofix Once

on:
  push:
    branches: [fix/p1-ui-french-copy-audit]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-ui-french-copy-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Franciser les derniers textes ciblés
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const replacements = {
            'web/src/pages/LandingPage.tsx': [
              [
                'Pilote Somafrik : pays, établissements, droits Admin Pays/School, conformité et supervision globale.',
                'Pilote Somafrik : pays, établissements, droits des administrateurs pays et établissement, conformité et supervision globale.'
              ],
              ['title: "Superadmin"', 'title: "Super administrateur"'],
              ['Matrice configurable par le Superadmin ou par établissement', 'Matrice configurable par le Super administrateur ou par établissement'],
              ['["Superadmin", "Admin pays", "Admin établissement"]', '["Super administrateur", "Administrateur pays", "Administrateur établissement"]'],
              ['accès configurés par le Superadmin', 'accès configurés par le Super administrateur'],
              ['permissions configurable par le Superadmin', 'permissions configurable par le Super administrateur'],
            ],
            'Mobile/src/screens/MessagesScreen.tsx': [
              [
                'Messages:CREATE seul ne fournit pas de source canonique de destinataires. Le composer staff exige aussi\n              Contacts:READ et Relations:READ (ou Gérer utilisateurs / privilèges plateforme). Aucun envoi n\'est proposé.',
                'Le droit de création de messages ne fournit pas à lui seul de source canonique de destinataires. La composition d’un message au personnel exige aussi\n              les droits de lecture des Contacts et des Relations (ou la gestion des utilisateurs / privilèges plateforme). Aucun envoi n\'est proposé.'
              ],
            ],
            'web/src/pages/parametres/EstablishmentProfilePage.tsx': [
              [
                "Vous disposez d'un accès en lecture seule. Seul l'Admin School peut modifier le profil.",
                "Vous disposez d'un accès en lecture seule. Seul l’administrateur de l’établissement peut modifier le profil."
              ],
            ],
          };

          let changed = 0;
          for (const [file, pairs] of Object.entries(replacements)) {
            let source = fs.readFileSync(file, 'utf8');
            const before = source;
            for (const [from, to] of pairs) source = source.split(from).join(to);
            if (source !== before) {
              fs.writeFileSync(file, source);
              changed += 1;
              console.log(`modifié: ${file}`);
            }
          }
          console.log(`fichiers modifiés: ${changed}`);
          NODE
      - name: Commit ciblé
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Aucune modification à committer"
            exit 0
          fi
          git config user.name "Somafrik UI French Bot"
          git config user.email "somafrik@outlook.fr"
          git add web/src/pages/LandingPage.tsx Mobile/src/screens/MessagesScreen.tsx web/src/pages/parametres/EstablishmentProfilePage.tsx
          git commit -m "fix(ui): terminer la francisation des copies ciblées"
          git push origin HEAD:fix/p1-ui-french-copy-audit
