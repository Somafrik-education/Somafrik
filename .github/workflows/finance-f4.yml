name: Finance F4

on:
  pull_request:
    branches: [develop]
    paths:
      - 'backend/lib/finance**'
      - 'backend/db/finance**'
      - 'backend/db/migrations/20260828_finance_f4_allocation_balance.sql'
      - 'backend/scripts/verify-finance-allocation-balance.js'
      - '.github/workflows/finance-f4.yml'

permissions:
  contents: read

jobs:
  allocation-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: F4 allocation and balance gate
        run: node backend/scripts/verify-finance-allocation-balance.js
