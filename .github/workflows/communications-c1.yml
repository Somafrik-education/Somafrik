name: Communications C1

on:
  pull_request:
    branches: [develop]
    paths:
      - "backend/db/clientsSchema.js"
      - "backend/db/clientsPgStore.js"
      - "backend/lib/clientsService.js"
      - "backend/lib/clientsManagement.js"
      - "backend/lib/communicationsMessagesService.js"
      - "backend/lib/platformService.js"
      - "backend/lib/communicationsReadiness.http.pg.test.js"
      - "backend/scripts/verify-communications-e2e.js"
      - "backend/server.js"
      - "backend/services/rbacService.js"
      - "web/src/pages/parametres/SettingsPlaceholders.tsx"
      - "web/src/pages/NotificationsPage.tsx"
      - "web/src/lib/clientsApi.ts"
      - "web/src/lib/announcementsRead.ts"
      - "Mobile/src/screens/MessagesScreen.tsx"
      - "Mobile/src/screens/AnnouncementsScreen.tsx"
      - "Mobile/src/lib/outbox.ts"
      - "docs/audits/communications-c1-readiness-2026-08-28.md"
      - ".github/workflows/communications-c1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  communications-c1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix web
      - name: Verify Communications C1 E2E
        run: npm run verify:communications-e2e
