name: Mobile Preview Windows

on:
  pull_request:
    branches: [develop]
    paths:
      - "Mobile/**"
      - ".github/workflows/mobile-preview-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-windows:
    name: Preview verifier Windows
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: Mobile/package-lock.json
      - name: Install Mobile dependencies
        working-directory: Mobile
        run: npm ci
      - name: Unit tests Preview spawn Windows
        shell: pwsh
        run: node Mobile/scripts/verify-mobile-preview-apk.test.js
      - name: expo config preview
        working-directory: Mobile
        shell: pwsh
        env:
          EXPO_PUBLIC_RELEASE_PROFILE: preview
          EAS_BUILD_PROFILE: preview
          EXPO_PUBLIC_API_URL: https://api-preprod.somafrik.app
          EXPO_PUBLIC_API_URL_PREVIEW: https://api-preprod.somafrik.app
          EXPO_PUBLIC_DEMO_MODE: "false"
        run: npx expo config --type public --json
      - name: verify:mobile-preview-apk:core
        working-directory: Mobile
        run: npm run verify:mobile-preview-apk:core
