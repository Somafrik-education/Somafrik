name: Tenant revalidation P0

on:
  pull_request:
    branches: [develop]
    paths:
      - "backend/lib/usersSchoolScope.js"
      - "backend/lib/academicYearSchoolScope.js"
      - "backend/lib/financeSchoolScope.js"
      - "backend/lib/tenantRevalidation.guard.test.js"
      - "backend/scripts/verify-tenant-revalidation.js"
      - "backend/scripts/verify-users-tenant.js"
      - "backend/scripts/verify-academic-year-tenant.js"
      - "backend/lib/usersTenant.http.pg.test.js"
      - "backend/lib/academicYearTenant.http.pg.test.js"
      - "backend/lib/financeMembershipScope.pg.test.js"
      - "backend/server.js"
      - "package.json"
      - ".github/workflows/tenant-revalidation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
      - name: Verify tenant revalidation Finance Enrollment AY Users
        run: npm run verify:tenant-revalidation
