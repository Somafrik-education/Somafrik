name: Apply Unassigned User Visibility Fix

on:
  push:
    branches:
      - agent/p0-unassigned-user-visibility

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-unassigned-user-visibility
          fetch-depth: 0
      - name: Patch visibility rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ua = Path('web/src/lib/userAccounts.ts')
          s = ua.read_text()
          old = '''/** Comptes plateforme gérables par le Superadmin (dont ceux créés par un Admin Pays). */
export function isSuperadminManagedUser(user: Pick<UserAccount, "role">): boolean {
  const key = normalizedPlatformRoleKey(user.role);
  return (
    normalizedPlatformRoleKey(COUNTRY_ADMIN_ROLE) === key ||
    normalizedPlatformRoleKey(SCHOOL_ADMIN_ROLE) === key
  );
}
'''
          new = '''export function isUnassignedUserAccount(user: Pick<UserAccount, "role" | "roles" | "assignmentStatus">): boolean {
  const role = normalize(String(user.role ?? ""));
  const roles = Array.isArray(user.roles) ? user.roles.filter((item) => normalize(item)) : [];
  const assignmentStatus = normalize(String(user.assignmentStatus ?? ""));
  return roles.length === 0 && (!role || role === "sans affectation") && (!assignmentStatus || assignmentStatus === "sans affectation");
}

/** Comptes plateforme gérables par le Superadmin (dont les identités encore sans rôle). */
export function isSuperadminManagedUser(user: Pick<UserAccount, "role" | "roles" | "assignmentStatus">): boolean {
  if (isUnassignedUserAccount(user)) return true;
  const key = normalizedPlatformRoleKey(user.role);
  return (
    normalizedPlatformRoleKey(COUNTRY_ADMIN_ROLE) === key ||
    normalizedPlatformRoleKey(SCHOOL_ADMIN_ROLE) === key
  );
}
'''
          if s.count(old) != 1:
              raise SystemExit(f'userAccounts target count={s.count(old)}')
          ua.write_text(s.replace(old, new, 1))

          scope = Path('web/src/lib/scope.ts')
          t = scope.read_text()
          old_import = 'import { isSuperadminManagedUser } from "./userAccounts";'
          if t.count(old_import) != 1:
              raise SystemExit(f'import target count={t.count(old_import)}')
          t = t.replace(old_import, 'import { isSuperadminManagedUser, isUnassignedUserAccount } from "./userAccounts";', 1)
          old_filter = '''    return visible.filter(
      (account) =>
        account.role === SCHOOL_ADMIN_ROLE &&
        (countryScopeMatches(account.countryScope, user.countryScope) ||
          countrySchoolCodes.has(normalize(account.schoolCode))),
    );'''
          new_filter = '''    return visible.filter(
      (account) =>
        (account.role === SCHOOL_ADMIN_ROLE || isUnassignedUserAccount(account)) &&
        (countryScopeMatches(account.countryScope, user.countryScope) ||
          countrySchoolCodes.has(normalize(account.schoolCode))),
    );'''
          if t.count(old_filter) != 1:
              raise SystemExit(f'country filter target count={t.count(old_filter)}')
          scope.write_text(t.replace(old_filter, new_filter, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Somafrik CTO Bot"
          git config user.email "cto-bot@somafrik.local"
          git add web/src/lib/userAccounts.ts web/src/lib/scope.ts
          git commit -m "fix(users): garder visibles les identités sans rôle"
          git push origin HEAD:agent/p0-unassigned-user-visibility
