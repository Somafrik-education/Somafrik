name: Planning Presence Sync E2E revalidation

on:
  pull_request:
    branches: [develop]
    paths:
      - "backend/lib/planningPresenceSyncRevalidation.http.pg.test.js"
      - "backend/lib/planningPresenceSyncRevalidation.guard.test.js"
      - "backend/lib/planningPresenceSyncRevalidation.findings.md"
      - "backend/scripts/verify-planning-presence-sync-revalidation.js"
      - "backend/lib/pedagogyService.js"
      - "backend/lib/pedagogyManagement.js"
      - "backend/lib/mobileSyncClasses.js"
      - "backend/lib/mobileSyncStudents.js"
      - "backend/lib/mobileSyncAssignments.js"
      - "backend/lib/mobileSyncSchoolCourses.js"
      - "backend/lib/mobileSyncCourseSchedules.js"
      - "backend/lib/mobileSyncScope.js"
      - "backend/db/pedagogyPgStore.js"
      - "backend/server.js"
      - "package.json"
      - ".github/workflows/planning-presence-sync-revalidation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-presence-sync-revalidation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
      - name: Verify Planning Presence Sync E2E revalidation
        run: npm run verify:planning-presence-sync-revalidation
