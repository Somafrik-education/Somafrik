name: CI Full Nightly

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: ci-full-nightly
  cancel-in-progress: false

env:
  NODE_VERSION: "22.12.0"
  DATABASE_URL: postgresql://somafrik:somafrik123@localhost:5432/somafrik

jobs:
  full-regression:
    name: Full regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: somafrik
          POSTGRES_USER: somafrik
          POSTGRES_PASSWORD: somafrik123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U somafrik -d somafrik"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: Quality
        env:
          VITE_API_URL: https://api.somafrik.app
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run build
      - name: Full domain regression
        run: |
          set -euo pipefail
          npm --prefix web run verify:student-enrollment
          npm run verify:class-student-enrollment
          npm run verify:teacher-account-creation
          npm run verify:teachers-lifecycle
          npm run verify:teacher-login-scope
          npm run verify:schools-legacy-cleanup
          npm run verify:school-code-v2
          npm run verify:finance-legacy-cleanup
          npm run verify:pedagogy-management
          npm run verify:planning-v2-weekly
          npm run verify:planning-v2-web
          npm run verify:planning-rooms
          npm run verify:planning-replacements
          npm run verify:planning-course-options
          npm run verify:teacher-course-canonical-reconcile
          npm run verify:pedagogy-legacy-cleanup
          npm run verify:help-v1a-catalogue
          npm run verify:help-v1b-web
          npm run verify:finance-domain-invariants
          npm run verify:finance-fee-type-canonical
          npm run verify:finance-obligation-lifecycle
          npm run verify:finance-management
          npm run verify:finance-multi-item-payment
          npm run verify:finance-web-mobile-convergence
          npm run verify:finance-rbac
          npm run verify:mobile-data-truth
          npm run verify:mobile-evaluations-v2
          npm run verify:mobile-planning-v2
          npm --prefix Mobile run verify:mobile-domain-hydration
          npm run verify:mobile-usability
          npm run verify:mobile-form-fields
          npm run verify:mobile-home-data-truth
          npm run verify:mobile-school-scope-transport
          npm run verify:mobile-no-catalog-runtime-data
          npm run verify:mobile-canonical-route-map
          npm run verify:mobile-canonical-role-identity
          npm run verify:mobile-live-permissions-refresh
          npm run verify:mobile-cta-rbac-alignment
          npm run verify:mobile-attendance-hydration
          npm run verify:mobile-class-attendance-rate
          npm run verify:mobile-ui-e2e-scaffold
          npm run test:mobile-ui-e2e-runtime
          npm run verify:mobile-release-readiness
          npm run verify:mobile-preview-apk
          npm run verify:mobile-network-resilience
          npm run verify:platform-management
          npm run verify:platform-legacy-cleanup
          npm run verify:clients-management
          npm run verify:user-role-lifecycle
          npm run verify:users-login-identity
          npm run verify:parent-linking
          npm run verify:presences-roster
          npm run verify:education-reference-data
          npm run verify:establishment-roles-data
          npm run verify:functional-rbac
          npm run verify:planning-rbac-reconcile
          npm run verify:evaluation-types-data
          npm run verify:school-settings-data
          npm run verify:documents-exams-data
          npm run verify:login-lockout-data
          npm run verify:data-export-safety
          npm run verify:clients-legacy-cleanup
          npm run verify:backoffice-state-removal
          npm run verify:canonical-state-convergence
          npm run verify:sync-end-to-end
          node scripts/verify-remove-legacy-sync-core.js
          npm run verify:students-fiche-consolidation
          npm run verify:teachers-domain-constraints-boot
      - name: Build preproduction backend image
        env:
          POSTGRES_DB: somafrik
          POSTGRES_USER: somafrik
          POSTGRES_PASSWORD: ci-preprod-postgres-password-32
          JWT_SECRET: ci-preprod-jwt-secret-with-enough-length-for-checks
          APP_ENV: preproduction
          SOMAFRIK_API_DOMAIN: localhost
          VITE_SHOW_DEMO_ACCOUNTS: "false"
        run: docker compose -f docker-compose.preprod.yml build backend
      - name: Bootstrap runtime guard
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
          SOMAFRIK_DB_REQUIRED: "true"
          SOMAFRIK_SKIP_DEMO_SEED: "true"
          SOMAFRIK_BOOTSTRAP_REQUIRED: "true"
          SOMAFRIK_BOOTSTRAP_PORT: "5057"
        run: node scripts/verify-runtime-bootstrap.js
