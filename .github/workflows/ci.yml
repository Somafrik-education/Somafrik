name: CI Full Nightly

# CI-FAST-01 — niveau B (nuit, develop) et, par workflow_call, niveau C
# (release-gate.yml) sur le SHA candidat exact.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "SHA candidat exact (niveau C)"
        required: true
        type: string

concurrency:
  # Un groupe par déclencheur et par révision : un appel du niveau C n'est
  # jamais mis en attente ni remplacé par l'exécution de nuit.
  group: ci-full-${{ github.event_name }}-${{ inputs.ref || 'develop' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.12.0"
  DATABASE_URL: postgresql://somafrik:somafrik123@localhost:5432/somafrik

jobs:
  full-regression:
    name: Full regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: somafrik
          POSTGRES_USER: somafrik
          POSTGRES_PASSWORD: somafrik123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U somafrik -d somafrik"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'develop' }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: Quality
        env:
          VITE_API_URL: https://api.somafrik.app
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run build
      - name: verify:school-code-v2
        run: npm run verify:school-code-v2
      - name: verify:mobile-usability
        run: npm run verify:mobile-usability
      - name: verify:mobile-network-resilience
        run: npm run verify:mobile-network-resilience
      - name: Full domain regression
        run: |
          # Conserver TOUS les tests bloquants, mais recueillir chaque code de sortie.
          # Aucun test masqué : la commande retourne 1 si au moins un contrôle échoue.
          set -uo pipefail
          failures=()
          successes=0
          run_check() {
            local label="$*"
            local status=0
            echo "::group::$label"
            "$@" || status=$?
            echo "::endgroup::"
            if (( status != 0 )); then
              failures+=("$label (exit $status)")
              echo "::error title=Release regression failed::$label (exit $status)"
            else
              successes=$((successes + 1))
            fi
          }
          run_check npm --prefix web run verify:student-enrollment
          run_check npm run verify:class-student-enrollment
          run_check npm run verify:teacher-account-creation
          run_check npm run verify:teachers-lifecycle
          run_check npm run verify:teacher-login-scope
          run_check npm run verify:schools-legacy-cleanup
          run_check npm run verify:finance-legacy-cleanup
          run_check npm run verify:pedagogy-management
          run_check npm run verify:planning-v2-weekly
          run_check npm run verify:planning-v2-web
          run_check npm run verify:planning-rooms
          run_check npm run verify:planning-replacements
          run_check npm run verify:planning-course-options
          run_check npm run verify:teacher-course-canonical-reconcile
          run_check npm run verify:pedagogy-legacy-cleanup
          run_check npm run verify:help-v1a-catalogue
          run_check npm run verify:help-v1b-web
          run_check npm run verify:finance-domain-invariants
          run_check npm run verify:finance-fee-type-canonical
          run_check npm run verify:finance-obligation-lifecycle
          run_check npm run verify:finance-management
          run_check npm run verify:finance-multi-item-payment
          run_check npm run verify:finance-web-mobile-convergence
          run_check npm run verify:finance-rbac
          run_check npm run verify:mobile-data-truth
          run_check npm run verify:mobile-evaluations-v2
          run_check npm run verify:mobile-planning-v2
          run_check npm --prefix Mobile run verify:mobile-domain-hydration
          run_check npm run verify:mobile-form-fields
          run_check npm run verify:mobile-home-data-truth
          run_check npm run verify:mobile-school-scope-transport
          run_check npm run verify:mobile-no-catalog-runtime-data
          run_check npm run verify:mobile-canonical-route-map
          run_check npm run verify:mobile-canonical-role-identity
          run_check npm run verify:mobile-live-permissions-refresh
          run_check npm run verify:mobile-cta-rbac-alignment
          run_check npm run verify:mobile-attendance-hydration
          run_check npm run verify:mobile-class-attendance-rate
          run_check npm run verify:mobile-ui-e2e-scaffold
          run_check npm run test:mobile-ui-e2e-runtime
          run_check npm run verify:mobile-release-readiness
          run_check npm run verify:mobile-preview-apk
          run_check npm run verify:mobile-network-resilience
          run_check npm run verify:platform-management
          run_check npm run verify:platform-legacy-cleanup
          run_check npm run verify:clients-management
          run_check npm run verify:user-role-lifecycle
          run_check npm run verify:users-login-identity
          run_check npm run verify:parent-linking
          run_check npm run verify:presences-roster
          run_check npm run verify:education-reference-data
          run_check npm run verify:establishment-roles-data
          run_check npm run verify:functional-rbac
          run_check npm run verify:supabase-data-api-lockdown
          run_check npm run verify:function-search-path
          run_check npm run verify:platform-personal-data-deny
          run_check npm run verify:planning-rbac-reconcile
          run_check npm run verify:evaluation-types-data
          run_check npm run verify:school-settings-data
          run_check npm run verify:student-access-cards
          run_check npm run verify:documents-exams-data
          run_check npm run verify:login-lockout-data
          run_check npm run verify:data-export-safety
          run_check npm run verify:clients-legacy-cleanup
          run_check npm run verify:backoffice-state-removal
          run_check npm run verify:canonical-state-convergence
          run_check npm run verify:sync-end-to-end
          run_check node scripts/verify-remove-legacy-sync-core.js
          run_check npm run verify:students-fiche-consolidation
          run_check npm run verify:teachers-domain-constraints-boot
          echo "Release regression: $successes PASS, ${#failures[@]} FAIL / $((successes + ${#failures[@]})) checks"
          if (( ${#failures[@]} > 0 )); then
            printf 'FAIL: %s\\n' "${failures[@]}"
            exit 1
          fi
      - name: Build preproduction backend image
        env:
          POSTGRES_DB: somafrik
          POSTGRES_USER: somafrik
          POSTGRES_PASSWORD: ci-preprod-postgres-password-32
          JWT_SECRET: ci-preprod-jwt-secret-with-enough-length-for-checks
          APP_ENV: preproduction
          SOMAFRIK_API_DOMAIN: localhost
          VITE_SHOW_DEMO_ACCOUNTS: "false"
        run: docker compose -f docker-compose.preprod.yml build backend
      - name: Bootstrap runtime guard
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
          SOMAFRIK_DB_REQUIRED: "true"
          SOMAFRIK_SKIP_DEMO_SEED: "true"
          SOMAFRIK_BOOTSTRAP_REQUIRED: "true"
          SOMAFRIK_BOOTSTRAP_PORT: "5057"
        run: node scripts/verify-runtime-bootstrap.js
