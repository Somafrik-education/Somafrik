name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-build:
    name: Lint et build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: somafrik
          POSTGRES_USER: somafrik
          POSTGRES_PASSWORD: somafrik123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U somafrik -d somafrik"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json

      - name: Install dependencies
        run: npm run ci:install

      - run: npm run lint --if-present
      - run: npm run build --if-present
        env:
          VITE_API_URL: https://api.somafrik.app

      - name: Build image préproduction
        env:
          POSTGRES_DB: somafrik
          POSTGRES_USER: somafrik
          POSTGRES_PASSWORD: ci-preprod-postgres-password-32
          JWT_SECRET: ci-preprod-jwt-secret-with-enough-length-for-checks
          APP_ENV: preproduction
          SOMAFRIK_API_DOMAIN: localhost
          VITE_SHOW_DEMO_ACCOUNTS: "false"
        run: docker compose -f docker-compose.preprod.yml build backend

      - name: Smoke test backend boot + health (PostgreSQL)
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
          DATABASE_URL: postgresql://somafrik:somafrik123@localhost:5432/somafrik
          SOMAFRIK_DB_REQUIRED: "true"
          SOMAFRIK_SKIP_DEMO_SEED: "true"
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5000/api/health > /dev/null; then
              echo "Backend healthy"
              kill $SERVER_PID
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          kill $SERVER_PID || true
          exit 1
