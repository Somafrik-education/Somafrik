name: Web smoke GO-PROD

on:
  pull_request:
    branches: [develop]
    paths:
      - "scripts/verify-web-smoke.js"
      - "docs/audits/web-smoke-goprod-2026-09-01.md"
      - "package.json"
      - ".github/workflows/web-smoke.yml"
      - "web/src/pages/LoginPage.tsx"
      - "web/src/context/AuthContext.tsx"
      - "web/src/App.tsx"
      - "backend/scripts/dev-memory.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: development
      JWT_SECRET: ci-web-smoke-jwt-secret-with-enough-length-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix web
      - name: Verify Web smoke (local SHA-linked, no deploy)
        run: npm run verify:web-smoke
