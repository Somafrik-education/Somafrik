name: HELP user guide

on:
  pull_request:
    branches: [develop]
    paths:
      - "packages/help-catalog/**"
      - "web/src/help/**"
      - "Mobile/src/help/**"
      - "Mobile/src/navigation/AppNavigator.tsx"
      - "Mobile/metro.config.js"
      - "Mobile/tsconfig.json"
      - "Mobile/package.json"
      - "Mobile/package-lock.json"
      - "docs/audits/help-user-guide-current-state.md"
      - "docs/audits/help-web-route-coverage.md"
      - "web/src/App.tsx"
      - "scripts/verify-help-user-guide.js"
      - "scripts/verify-help-v1a-catalogue.js"
      - "scripts/verify-help-v1b-web.js"
      - "package.json"
      - ".github/workflows/help-user-guide.yml"
  workflow_dispatch:

permissions:
  contents: read

# CI-FAST-01 : une nouvelle poussée sur la PR annule l'exécution précédente
# (les autres déclencheurs ne sont jamais annulés).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  help-user-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install web and Mobile dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix Mobile
      - name: Verify help user guide
        run: npm run verify:help-user-guide
