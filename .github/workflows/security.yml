name: Security Nightly

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

concurrency:
  group: security-nightly
  cancel-in-progress: false

env:
  NODE_VERSION: "22.12.0"
  DATABASE_URL: postgresql://somafrik:somafrik123@localhost:5432/somafrik
  GITLEAKS_VERSION: "8.24.3"

jobs:
  security:
    name: Security deep scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: somafrik
          POSTGRES_USER: somafrik
          POSTGRES_PASSWORD: somafrik123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U somafrik -d somafrik"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Full secrets scan
        run: gitleaks detect --source . --verbose --redact --exit-code 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: npm run ci:install
      - name: Dependency audit
        run: npm run audit:ci
      - name: Security invariants
        run: |
          set -euo pipefail
          npm run verify:v2-foundation
          npm run verify:jwt-header
          npm run verify:auth-sessions
          npm run verify:privacy-erasure
          npm run verify:rbac-s1-4
          npm run verify:sanitize-user-responses
          npm run verify:db-config
          npm run verify:sync-contacts-removed
          npm run verify:mobile-security
          npm run verify:functional-rbac
          npm run verify:supabase-data-api-lockdown
          npm run verify:platform-personal-data-deny
      - name: Runtime bootstrap security
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
          SOMAFRIK_DB_REQUIRED: "true"
          SOMAFRIK_SKIP_DEMO_SEED: "true"
          SOMAFRIK_BOOTSTRAP_REQUIRED: "true"
          SOMAFRIK_BOOTSTRAP_PORT: "5058"
        run: npm run verify:runtime-bootstrap
