name: Merge authorization (R15)

# Publie le statut « governance/merge-authorization » sur le HEAD exact de la PR.
# Non bloquant tant que le Ruleset de la branche cible ne l'exige pas
# (voir docs/governance/MERGE-AUTHORIZATION.md, §6).
#
# Sécurité (vérifiée en recette, PR #1001 — docs §5 et §7) :
# - Pour `pull_request` et `pull_request_review`, GitHub exécute la version de ce
#   fichier présente dans la PR (merge ref). Une PR qui modifie ce fichier peut donc
#   altérer le statut qu'elle reçoit : le statut n'est qu'une défense en profondeur.
#   La barrière est l'approbation CTO du dernier push (Ruleset) qui couvre tout
#   changement sous .github/.
# - `pull_request_target` n'est pas utilisé : depuis le 08/12/2025, GitHub l'exécute
#   depuis la branche par défaut (main), il ne se déclencherait donc jamais tant que
#   ce fichier n'y est pas.
# - Le YAML de la branche cible extrait le script de la branche cible, pas celui de la PR
#   (une PR qui modifie ce YAML peut changer ce comportement : voir premier point).

# ---------------------------------------------------------------------------
# GOV-PAUSE-02 — R15 SUSPENDU pendant le développement (décision CTO requise).
# Les déclencheurs automatiques sont désactivés : aucun statut
# « governance/merge-authorization » n'est publié sur les PR (ni success, ni
# failure). Le script, la configuration et les tests R15 restent inchangés et
# testés en CI (Core tests → verify:governance-r15).
# Fail-closed : si un Ruleset exige ce statut, son absence bloque la fusion.
# Réactivation : retirer les « # » des 5 lignes ci-dessous (procédure complète :
# docs/governance/GOV-PAUSE-02.md).
# ---------------------------------------------------------------------------
on:
  # pull_request:
  #   types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  #   branches: [develop, main]
  # pull_request_review:
  #   types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Numéro de la PR à réévaluer"
        required: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

concurrency:
  group: merge-authorization-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: merge-authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extraire le script de la branche cible uniquement
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          persist-credentials: false
          sparse-checkout: scripts/governance
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Refus explicite si le script est absent de la branche cible
        # Cas d'amorçage (la branche cible ne porte pas encore R15) : fail-closed lisible.
        if: hashFiles('scripts/governance/verify-merge-authorization.mjs') == ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)"
          gh api -X POST "repos/$REPO/statuses/$head_sha" \
            -f state=failure \
            -f context=governance/merge-authorization \
            -f description="Refusé : script de gouvernance absent de la branche cible (fail-closed)."
          echo "Refusé : scripts/governance absent de la branche cible ; statut failure publié sur $head_sha." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Évaluer l'autorisation et publier le statut
        if: hashFiles('scripts/governance/verify-merge-authorization.mjs') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node scripts/governance/verify-merge-authorization.mjs --pr "$PR_NUMBER"
