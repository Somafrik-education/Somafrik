name: P0 School Login Patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/p0-school-login'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply fail-closed patch
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('backend/db/postgresRepository.js')
          text = repo.read_text()
          old = '''    const countryScope = this.getCountryScopeForUser(school, countryCode);\n\n    return {\n      id: user.id,\n      schoolId: user.school_id,\n      publicId: user.user_code,'''
          new = '''    const countryScope = this.getCountryScopeForUser(school, countryCode);\n    let profilePayload = {};\n    if (user.profile_payload && typeof user.profile_payload === "object") {\n      profilePayload = user.profile_payload;\n    } else if (typeof user.profile_payload === "string" && user.profile_payload.trim()) {\n      try {\n        profilePayload = JSON.parse(user.profile_payload);\n      } catch {\n        profilePayload = {};\n      }\n    }\n    const identityCode = String(profilePayload.identityCode ?? user.identity_code ?? "").trim();\n\n    return {\n      id: user.id,\n      schoolId: user.school_id,\n      publicId: identityCode || user.user_code,\n      identityCode: identityCode || user.user_code,\n      userCode: user.user_code,'''
          if text.count(old) != 1:
              raise SystemExit(f'postgresRepository patch expected exactly once, found {text.count(old)}')
          repo.write_text(text.replace(old, new, 1))

          test = Path('backend/scripts/verify-admin-user-creation.js')
          text = test.read_text()
          old = '''    const activeSchoolGranted = await grantRole(superadmin.token, activeSchoolIdentity.id, "Admin School", "SCHOOL_ADMIN");\n    assert.equal(activeSchoolGranted.status, "Actif");\n    const activeSchoolPg = await assertPgRole(pool, activeSchoolIdentity.id, "SCHOOL_ADMIN");\n    assert.equal(activeSchoolPg.status, "active");\n    const schoolAdmin = await login(schoolAdminEmail, schoolAdminPassword, SCHOOL_CD);\n    assert.ok((schoolAdmin.user.roleKeys || []).includes("SCHOOL_ADMIN"), "login Admin School sans SCHOOL_ADMIN");'''
          new = '''    // Reproduit le contrat préprod : l'identifiant affiché dans la liste peut être un identityCode\n    // distinct du user_code technique. Cet identifiant public doit être utilisable au login.\n    const displayedSchoolAdminId = "KT-26-00001";\n    await pool.query(\n      `UPDATE users\n          SET profile_payload = jsonb_set(COALESCE(profile_payload, '{}'::jsonb), '{identityCode}', to_jsonb($2::text), true),\n              updated_at = NOW()\n        WHERE id = $1`,\n      [activeSchoolIdentity.id, displayedSchoolAdminId],\n    );\n\n    const activeSchoolGranted = await grantRole(superadmin.token, activeSchoolIdentity.id, "Admin School", "SCHOOL_ADMIN");\n    assert.equal(activeSchoolGranted.status, "Actif");\n    const activeSchoolPg = await assertPgRole(pool, activeSchoolIdentity.id, "SCHOOL_ADMIN");\n    assert.equal(activeSchoolPg.status, "active");\n\n    const listedSchoolAdmins = extractList((await request("/backoffice/users", { token: superadmin.token })).data);\n    const listedSchoolAdmin = listedSchoolAdmins.find((row) => String(row.id) === String(activeSchoolIdentity.id));\n    assert.ok(listedSchoolAdmin, "Admin School absent de GET /backoffice/users");\n    assert.equal(listedSchoolAdmin.publicId, displayedSchoolAdminId, "identifiant affiché inattendu");\n\n    const schoolAdmin = await login(displayedSchoolAdminId, schoolAdminPassword, SCHOOL_CD);\n    assert.ok((schoolAdmin.user.roleKeys || []).includes("SCHOOL_ADMIN"), "login Admin School par publicId sans SCHOOL_ADMIN");\n    const schoolAdminReload = await login(displayedSchoolAdminId, schoolAdminPassword, SCHOOL_CD);\n    assert.ok((schoolAdminReload.user.roleKeys || []).includes("SCHOOL_ADMIN"), "relogin Admin School par publicId échoué");'''
          if text.count(old) != 1:
              raise SystemExit(f'E2E patch expected exactly once, found {text.count(old)}')
          test.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- backend/db/postgresRepository.js backend/scripts/verify-admin-user-creation.js
      - name: Commit product patch
        run: |
          git config user.name "somafrik-cto-bot"
          git config user.email "cto-bot@somafrik.local"
          git add backend/db/postgresRepository.js backend/scripts/verify-admin-user-creation.js
          if git diff --cached --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git commit -m "fix(auth): aligner login sur identifiant public affiché"
          git push origin HEAD:${{ github.head_ref }}
