name: Android release readiness GO-PROD

on:
  pull_request:
    branches: [develop]
    paths:
      - "scripts/verify-android-release-readiness.js"
      - "docs/audits/android-release-readiness-goprod-2026-09-01.md"
      - "docs/audits/mobile-rc3-parked-rollback-to-rc2-2026-08-27.md"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/**"
      - "Mobile/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Verify Android release readiness (no EAS / no device / no deploy)
        run: npm run verify:android-release-readiness
