permissions:
  contents: read

jobs:
  communications-c4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
      COMMUNICATION_NOTIFICATIONS_WORKER: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact HEAD
        run: |
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
            Mobile/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix web
          npm ci --prefix Mobile
      - name: Verify Lot I safety guards
        run: node --test backend/lib/schoolNotificationSafety.test.js
      - name: Verify finance Mobile notification navigation
        run: |
          node --test backend/lib/communicationsFinanceMobileNavigation.test.js
          npx --yes tsx Mobile/src/lib/financeNotificationNavigation.test.ts
      - name: Verify Communications C4 E2E
        shell: bash
        run: |
          set -o pipefail
          npm run verify:communications-c4 2>&1 | tee communications-c4.log
      - name: Preserve C4 verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: communications-c4-verification
          path: communications-c4.log
          if-no-files-found: error
          retention-days: 7
      - name: Build Web
        run: npm --prefix web run build
      - name: Typecheck Mobile
        working-directory: Mobile
        run: npx tsc --noEmit --project tsconfig.json
      # Phase TESTS ROUGES notifications : ces suites échouent tant que les
      # correctifs C1/C2/C3 ne sont pas livrés. Le pas est volontairement
      # bloquant : rouge = défaut toujours présent, vert = défaut corrigé.
      # Il est placé en dernier pour que toutes les vérifications de
      # non-régression du portail s'exécutent avant.
      - name: RED notifications navigation (rouge attendu avant C1/C2/C3)
        shell: bash
        run: |
          set -o pipefail
          node --test \
            backend/lib/communicationsNavigationContract.red.test.js \
            backend/lib/communicationsPlanningNavigation.red.test.js \
            backend/lib/communicationsUnreadPagination.red.test.js \
            backend/lib/communicationsNavigationSecurity.red.test.js 2>&1 | tee notifications-red.log
      - name: Preserve RED notifications log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifications-red
          path: notifications-red.log
          if-no-files-found: warn
          retention-days: 7
