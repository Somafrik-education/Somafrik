name: NOTES-1105 Android QA APK (temporary)

on:
  push:
    branches:
      - build/notes-1105-qa-apk

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_RELEASE_PROFILE: "preview"
      EAS_BUILD_PROFILE: "preview"
      EXPO_PUBLIC_API_URL: "https://api-preprod.somafrik.app"
      EXPO_PUBLIC_API_URL_PREVIEW: "https://api-preprod.somafrik.app"
      EXPO_PUBLIC_DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert exact PR #1105 test candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4abd567f4952455bafd06db3ad124dcb0e0a80e7"
          test "$(git diff --name-only 4abd567f4952455bafd06db3ad124dcb0e0a80e7 HEAD)" = ".github/workflows/notes-1105-qa-apk.yml"
          echo "QA only: exact #1105 source HEAD + temporary workflow; no merge"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: Mobile/package-lock.json
      - name: Install Mobile dependencies
        working-directory: Mobile
        run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check Android SDK
        shell: bash
        run: |
          test -d /usr/local/lib/android/sdk
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - name: Prepare Expo native Android
        working-directory: Mobile
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Build standalone QA release APK
        working-directory: Mobile/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Validate artifact and publish SHA256
        shell: bash
        run: |
          set -euo pipefail
          apk=Mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -l "$apk" | grep -E "assets/index.android.bundle" || { echo "Embedded JS bundle missing"; exit 1; }
          mkdir -p apk-output
          cp "$apk" apk-output/somafrik-notes-1105-preprod-qa.apk
          sha256sum apk-output/*.apk | tee apk-output/SHA256SUMS.txt
          printf 'PR=1105\nPR_HEAD=4abd567f4952455bafd06db3ad124dcb0e0a80e7\nAPI=https://api-preprod.somafrik.app\nBUILD=Android release standalone QA; no Play signing\n' > apk-output/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: somafrik-notes-1105-preprod-qa-apk
          path: apk-output/
          if-no-files-found: error
          retention-days: 7
