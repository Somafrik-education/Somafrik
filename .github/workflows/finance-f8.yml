name: Finance F8

on:
  pull_request:
    branches: [develop]
    paths:
      - "backend/db/financeSchema.js"
      - "backend/db/financePgStore.js"
      - "backend/db/financeMemoryStore.js"
      - "backend/lib/financeService.js"
      - "backend/lib/financeManagement.js"
      - "backend/lib/financeUnallocatedCash.js"
      - "backend/lib/financeUnallocatedCash.test.js"
      - "backend/lib/financeCatalog.js"
      - "backend/lib/financeCatalog.test.js"
      - "backend/lib/financeObligationLifecycle.js"
      - "backend/lib/financeReadiness.http.pg.test.js"
      - "backend/services/unpaidService.js"
      - "backend/server.js"
      - "backend/scripts/verify-finance-readiness.js"
      - "web/src/lib/financeApi.ts"
      - "web/src/lib/financeIdempotency.ts"
      - "web/src/lib/unpaidModule.ts"
      - "web/src/lib/unpaidModule.currency.test.ts"
      - "web/src/components/payments/QuickPaymentModal.tsx"
      - "web/src/pages/EntityPage.tsx"
      - "web/src/pages/finances/FinanceFeesPage.tsx"
      - "web/src/pages/finances/FinanceUnpaidPage.tsx"
      - "docs/audits/finance-f8-production-readiness-2026-08-28.md"
      - ".github/workflows/finance-f8.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-f8:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-with-enough-length-for-production-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            web/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix web
      - name: Verify Finance F8 readiness
        run: npm run verify:finance-readiness
