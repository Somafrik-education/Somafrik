name: NFC encoding preproduction evidence

on:
  pull_request:
    branches: [develop]
    paths:
      - "Mobile/**"
      - "backend/**student*Card*"
      - "backend/db/migrations/20261012_student_cards_nfc_encoding.sql"
      - "backend/db/migrations/20261013_student_cards_nfc_reservations.sql"
      - "backend/db/migrations/20261017_student_cards_nfc_recovery.sql"
      - "backend/db/migrations/20261016_school_entry_events.sql"
      - "backend/db/schoolEntryEventsSchema.js"
      - "backend/lib/liveSchoolRoleKeys.js"
      - "backend/db/migrations/20261016_attendance_roll_calls.sql"
      - "backend/db/attendanceRollCallsSchema.js"
      - ".github/workflows/nfc-encoding-preprod.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfc-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nfc-verifier:
    name: NFC APK verifier unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verifier unit tests before any APK compilation
        run: python3 Mobile/scripts/verify-student-card-nfc-apk_test.py
      - name: Regression-test NFC guard before scanning release code
        run: python3 Mobile/scripts/verify-nfc-no-permanent-lock_test.py
      - name: Reject permanent NFC lock and raw-write operations
        run: python3 Mobile/scripts/verify-nfc-no-permanent-lock.py

  nfc-postgres:
    name: NFC PostgreSQL 16 isolated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nfc_encoding_test
          POSTGRES_USER: nfc_test
          POSTGRES_PASSWORD: nfc_test_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfc_test -d nfc_encoding_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install backend dependencies without browser downloads
        run: npm ci --prefix backend --ignore-scripts
      - name: NFC lifecycle, HTTP and regressions against disposable PostgreSQL
        env:
          SOMAFRIK_NFC_TEST_DATABASE_URL: postgresql://nfc_test:nfc_test_ci_only@localhost:5432/nfc_encoding_test
          DATABASE_URL: postgresql://nfc_test:nfc_test_ci_only@localhost:5432/nfc_encoding_test
          SOMAFRIK_NFC_EVIDENCE_DIR: ${{ runner.temp }}/nfc-integration-evidence
        run: |
          test -n "$SOMAFRIK_NFC_TEST_DATABASE_URL"
          node --test backend/lib/studentCardsNfcEncoding.sql.test.js backend/lib/studentCardsNfcEncoding.test.js backend/lib/studentCardsNfcLifecycle.pg.test.js backend/lib/studentCardsNfcDiagnosis.pg.test.js backend/lib/studentCardsNfcProvision.http.pg.test.js
          node backend/lib/studentAccessCards.pg.test.js
          node backend/lib/studentAccessCards.lifecycle.pg.test.js
          node backend/lib/studentAccessCards.resolve.pg.test.js
          node backend/lib/studentAccessCards.attendance.pg.test.js
          node backend/lib/studentAccessCards.finance.pg.test.js
          node --test backend/lib/studentCardVerification.test.js
          node backend/lib/studentCardVerification.http.pg.test.js
          node backend/lib/studentAccessCards.http.pg.test.js
          node backend/lib/studentAccessCards.scan.http.pg.test.js
          node --test backend/lib/studentCardRollCall.test.js
          node backend/lib/studentCardRollCall.http.pg.test.js
          node --test backend/lib/studentCardEntry.test.js
          node backend/lib/studentCardEntry.http.pg.test.js
          npm --prefix Mobile run test:student-card-nfc-integration
          npm --prefix Mobile run test:student-card-nfc-diagnosis
          npm --prefix Mobile run test:student-card-nfc-performance
          npm --prefix Mobile run test:student-card-class-roll-call-integration
          npm --prefix Mobile run test:student-card-entry-control-integration
      - name: Upload sanitized integration performance measurements
        uses: actions/upload-artifact@v4
        with:
          name: nfc-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/nfc-integration-evidence/orchestration.json
          if-no-files-found: error
          retention-days: 14

  nfc-mobile:
    name: NFC Android individual and batch contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install workspace and Mobile
        run: npm ci && npm ci --prefix Mobile
      - name: Verify individual programming, shared native session, QR and types
        run: |
          npm --prefix Mobile run test:student-card-nfc-encoding
          npm --prefix Mobile run test:student-card-nfc-batch
          npm --prefix Mobile run test:student-card-nfc-security
          npm --prefix Mobile run verify:student-card-qr
          npm --prefix Mobile run typecheck
          npm --prefix Mobile run verify:mobile-security
          (cd Mobile && npx --yes tsx --test src/lib/studentCardEntryControl.test.ts src/lib/studentCardEntryControlNavigation.test.ts src/lib/roleNavigationPreferences.test.ts)
          (cd Mobile && npx --yes tsx --test src/lib/studentCardVerify.test.ts src/lib/studentCardRollCall.test.ts src/lib/studentCardRollCallRoles.test.ts src/lib/studentCardClassRollCall.test.ts)
          (cd Mobile && npx --yes tsx --test src/lib/studentCardNfcReaderMode.test.ts src/lib/nfcSession.test.ts)

  nfc-apk:
    name: NFC APK preview exact HEAD
    needs: [nfc-verifier, nfc-postgres, nfc-mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_RELEASE_PROFILE: preview
      EAS_BUILD_PROFILE: preview
      EXPO_PUBLIC_API_URL: https://api-preprod.somafrik.app
      EXPO_PUBLIC_API_URL_PREVIEW: https://api-preprod.somafrik.app
      EXPO_PUBLIC_DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Re-run verifier unit tests before the Android SDK and Gradle
        run: python3 Mobile/scripts/verify-student-card-nfc-apk_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Mobile/package-lock.json
      - name: Install workspace and Mobile
        run: npm ci && npm ci --prefix Mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Validate Mobile security and types
        run: npm --prefix Mobile run verify:mobile-security && npm --prefix Mobile run typecheck
      - name: Generate Android from candidate sources (preview only)
        working-directory: Mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: Compile self-contained APK for ARM64 smoke (test signature only)
        working-directory: Mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Verify packaged API, native permissions, signature and secret patterns
        run: python3 Mobile/scripts/verify-student-card-nfc-apk.py Mobile/android/app/build/outputs/apk/release/app-release.apk --output Mobile/dist/nfc-evidence
      - name: Upload sanitized signature diagnostic when verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nfc-apk-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          path: Mobile/dist/nfc-evidence/signature-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload verified preview APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfc-preview-${{ github.event.pull_request.head.sha || github.sha }}
          path: Mobile/dist/nfc-evidence/*
          if-no-files-found: error
          retention-days: 14
