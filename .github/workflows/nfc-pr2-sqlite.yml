name: NFC PR2 SQLite schema invariants
# Tests Node de PR2 (moteur SQLite réel node:sqlite ; SQLCipher simulé ; parité Backend sous Node).
# Ne prouvent NI le chiffrement natif NI Hermes : voir nfc-pr2-native-proof.yml.
on:
  pull_request:
    paths:
      - 'Mobile/src/offline/rollCall/**'
      - 'Mobile/src/offline/l1/database.ts'
      - 'Mobile/scripts/generate-rc-offline-pr2-vectors.js'
      - 'Mobile/package.json'
      - 'Mobile/package-lock.json'
      - 'docs/audits/NFC-PRES-LOCAL-PR0-vectors.json'
      - 'docs/audits/NFC-PRES-LOCAL-PR2-vectors.json'
      - 'backend/lib/rollCallOffline*.js'
      - 'backend/contracts/reportCard/jcs.js'
      - '.github/workflows/nfc-pr2-sqlite.yml'
  workflow_dispatch:
jobs:
  sqlite-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Mobile/package-lock.json
      - name: Install workspace and Mobile
        run: npm ci && npm ci --prefix Mobile
      - name: Shared PR2 vectors reproduced by the Backend
        run: node Mobile/scripts/generate-rc-offline-pr2-vectors.js --check
      - name: Crypto parity, pack verification, SQLite store, crash recovery
        working-directory: Mobile
        # Node 22.12 expose node:sqlite uniquement avec ce drapeau expérimental.
        # Le sous-processus du test SIGKILL hérite également de NODE_OPTIONS.
        env:
          NODE_OPTIONS: --experimental-sqlite
        run: npm run test:rollcall-offline
      - name: Mobile typecheck
        run: npm --prefix Mobile run typecheck
