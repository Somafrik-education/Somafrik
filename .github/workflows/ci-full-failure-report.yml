name: FULL CI failure report

# CI-FAST-01 — niveau B : un échec de la CI complète (nuit ou post-fusion dans
# develop) ouvre, ou commente, une issue « ci:full-failure ». Séparé des
# workflows testés pour qu'ils gardent un jeton en lecture seule, y compris
# quand le niveau C (release-gate.yml) les appelle.

on:
  workflow_run:
    workflows: ["Backend test baseline (MONO-T0)", "CI Full Nightly"]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    name: Report full CI failure
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the ci:full-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          gh label create "ci:full-failure" --color B60205 --description "Échec du niveau B (FULL CI) — CI-FAST-01" --force
          title="FULL CI en échec — ${WORKFLOW}"
          body="Échec (${EVENT}) sur \`${SHA}\` (${BRANCH}). Exécution : ${RUN_URL}"
          number="$(gh issue list --label "ci:full-failure" --state open --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label "ci:full-failure" --body "$body"
          fi
