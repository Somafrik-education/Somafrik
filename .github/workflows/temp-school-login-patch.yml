name: Temporary school login patch

on:
  push:
    branches:
      - agent/school-login-code-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/school-login-code-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply guarded patch
        run: node scripts/patch-school-login-auth.js
      - name: Remove temporary patch machinery
        run: rm scripts/patch-school-login-auth.js .github/workflows/temp-school-login-patch.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/authService.js backend/services/backOfficeAccessService.js scripts/patch-school-login-auth.js .github/workflows/temp-school-login-patch.yml
          git commit -m "fix(auth): resolve canonical school login code"
          git push origin HEAD:agent/school-login-code-v2
