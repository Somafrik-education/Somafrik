name: P0 Reset Projection Fix
on:
  push:
    branches: [agent/p0-password-reset-lockout]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-password-reset-lockout
          fetch-depth: 0
      - name: Fix clients projection contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/server.js')
          text = p.read_text()
          old = '  const canonicalUsers = await repository.listClientsProjection();\n  const scopedUsers = tenantScopeService.filterRows(canonicalUsers, req.principal);'
          new = '  const { users: canonicalUsers = [] } = await repository.listClientsProjection();\n  const scopedUsers = tenantScopeService.filterRows(canonicalUsers, req.principal);'
          if text.count(old) != 1:
              raise SystemExit(f'expected projection block once, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          node --check backend/server.js
          git diff --check
      - name: Commit and push
        run: |
          git config user.name "somafrik-cto-bot"
          git config user.email "cto-bot@somafrik.local"
          git add backend/server.js
          git commit -m "fix(auth): utiliser users de la projection clients"
          git push origin HEAD:agent/p0-password-reset-lockout
