name: Demo live exchange

on:
  pull_request:
    paths:
      - "backend/scripts/verify-demo-live-exchange.js"
      - ".github/workflows/demo-live-exchange.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-exchange:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Probe public Demo gateway
        run: node backend/scripts/verify-demo-live-exchange.js
