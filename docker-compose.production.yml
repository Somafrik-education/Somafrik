# Stack production API Somafrik — PostgreSQL + backend API-only + Caddy (HTTPS)
# Frontend web : Vercel (https://somafrik.app, branche main)
# Usage : npm run production:up  (valide et charge .env.production)

name: somafrik-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB requis}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER requis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - somafrik_internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SKIP_WEB_BUILD: "true"
    image: somafrik-backend:production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      APP_ENV: ${APP_ENV:-production}
      SOMAFRIK_PUSH_SELFTEST_ENABLED: "false"
      SOMAFRIK_API_ONLY: "true"
      SOMAFRIK_DB_REQUIRED: "true"
      SOMAFRIK_SKIP_DEMO_SEED: "true"
      SOMAFRIK_DISABLE_LOGIN_LOCKOUT: "false"
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-2mb}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-15}
      SOMAFRIK_COMMUNICATION_STORAGE: ${SOMAFRIK_COMMUNICATION_STORAGE:-/var/lib/somafrik/communication-storage}
    volumes:
      # Named volume must mount at the same path the API writes to.
      - communication_storage:${SOMAFRIK_COMMUNICATION_STORAGE:-/var/lib/somafrik/communication-storage}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - somafrik_internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SOMAFRIK_API_DOMAIN: ${SOMAFRIK_API_DOMAIN:-api.somafrik.app}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - somafrik_internal

networks:
  somafrik_internal:
    driver: bridge

volumes:
  postgres_production_data:
  communication_storage:
  caddy_data:
  caddy_config:
