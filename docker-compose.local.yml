name: somafrik-local

# Boucle de développement rapide : PostgreSQL + Backend dans Docker.
# Expo/Metro reste volontairement sur le PC pour Expo Go et les émulateurs.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-somafrik}
      POSTGRES_USER: ${POSTGRES_USER:-somafrik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-somafrik-local-only}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-somafrik} -d ${POSTGRES_DB:-somafrik}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.local
    image: somafrik-backend-local:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-somafrik}:${POSTGRES_PASSWORD:-somafrik-local-only}@postgres:5432/${POSTGRES_DB:-somafrik}
      JWT_SECRET: ${JWT_SECRET:-somafrik-local-jwt-secret-never-use-in-production}
      SOMAFRIK_API_ONLY: "true"
      SOMAFRIK_DB_REQUIRED: "true"
      SOMAFRIK_SKIP_DEMO_SEED: ${SOMAFRIK_SKIP_DEMO_SEED:-false}
      SOMAFRIK_DISABLE_LOGIN_LOCKOUT: ${SOMAFRIK_DISABLE_LOGIN_LOCKOUT:-true}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000,http://localhost:8083,http://127.0.0.1:8083}
    volumes:
      - ./backend:/app
      - backend_local_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres_local_data:
  backend_local_node_modules:
