appId: com.somafrik.app
---
- runFlow: _login-admin-school.yaml
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-admin-dashboard"
    timeout: 20000
- assertVisible:
    id: "home-users-value"
    text: "${SOMAFRIK_E2E_EXPECTED_USERS}"
- assertVisible:
    id: "home-presence-value"
    text: "${SOMAFRIK_E2E_EXPECTED_PRESENCE}"
- assertVisible:
    id: "home-payments-value"
    text: "${SOMAFRIK_E2E_EXPECTED_PAYMENTS}"
- assertNotVisible: "Remplir avec un compte démo"
