appId: com.somafrik.app
---
- runFlow: flows/login-admin-school.yaml
- assertVisible:
    id: "home-admin-dashboard"
- assertVisible:
    id: "home-users-value"
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home-admin-dashboard"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "home-users-value"
    timeout: 25000
- assertVisible:
    id: "home-presence-value"
- assertNotVisible:
    id: "role-selection-screen"
- retry:
    maxRetries: 8
    commands:
      - copyTextFrom:
          id: "home-users-value"
      - assertTrue: "${!maestro.copiedText.startsWith('—') && !maestro.copiedText.includes('Indisponible')}"
