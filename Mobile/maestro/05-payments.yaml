appId: com.somafrik.app
---
- runFlow: flows/login-admin-school.yaml
- tapOn:
    id: "home-payments-value"
- extendedWaitUntil:
    visible: "Paiements"
    timeout: 20000
- wait: 8000
- assertNotVisible:
    id: "payments-error"
- runFlow:
    when:
      visible:
        id: "payments-empty"
    commands:
      - assertVisible:
          id: "payments-empty"
- runFlow:
    when:
      notVisible:
        id: "payments-empty"
    commands:
      - assertVisible:
          id: "payments-list"
